<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>计件工资统计</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }
    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="max-w-lg mx-auto bg-white min-h-screen shadow-lg">
    <!-- 顶部导航 -->
    <div class="bg-gradient-to-r from-blue-600 to-blue-700 text-white p-4 shadow-md">
      <h1 class="text-xl font-bold text-center">计件工资统计</h1>
      <div class="flex justify-between items-center mt-2">
        <button id="prevMonth" class="text-sm px-3 py-1 bg-white/20 rounded hover:bg-white/30">上一月</button>
        <span id="currentMonth" class="text-lg font-semibold"></span>
        <button id="nextMonth" class="text-sm px-3 py-1 bg-white/20 rounded hover:bg-white/30">下一月</button>
      </div>
    </div>

    <!-- 快捷输入区 -->
    <div class="p-4 border-b">
      <div class="flex gap-2">
        <textarea id="quickInput" rows="3" placeholder="输入格式: 20号 型号5000个（支持换行/逗号/分号分隔多条）" class="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 resize-none"></textarea>
        <button id="quickAdd" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">识别添加</button>
      </div>
      <div id="quickPreview" class="mt-2 p-2 bg-gray-50 rounded text-sm hidden"></div>
      <div class="text-xs text-gray-500 mt-1">支持多行输入，每行格式: "20号 型号5000个"</div>
    </div>

    <!-- 日期列表 -->
    <div class="p-4">
      <div class="flex flex-wrap gap-2 mb-4">
        <button id="todayBtn" class="px-3 py-1 bg-blue-100 text-blue-700 rounded text-sm">今天</button>
        <button id="clearDayBtn" class="px-3 py-1 bg-red-100 text-red-700 rounded text-sm">清空当天</button>
      </div>
      
      <div class="space-y-3 max-h-80 overflow-y-auto scrollbar-hide">
        <div id="dailyList"></div>
      </div>
    </div>

    <!-- 产品单价设置 -->
    <div class="p-4 border-t">
      <h3 class="font-semibold mb-3">产品单价设置</h3>
      <div class="space-y-2 max-h-40 overflow-y-auto scrollbar-hide" id="priceList"></div>
      <div class="flex gap-2 mt-3">
        <div class="flex-1 relative">
          <input type="text" id="newProduct" placeholder="产品型号" autocomplete="off" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500">
          <div id="productDropdown" class="absolute z-10 w-full mt-1 bg-white border border-gray-300 rounded-lg shadow-lg hidden max-h-48 overflow-y-auto"></div>
        </div>
        <input type="number" id="newPrice" placeholder="单价" class="w-24 px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500">
        <button id="addProduct" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">添加</button>
      </div>
    </div>

    <!-- 云端同步设置 -->
    <div class="p-4 border-t">
      <h3 class="font-semibold mb-3">云端同步</h3>
      <div id="cloudStatus" class="text-sm text-green-600 mb-1">已启用云端自动同步</div>
      <div class="text-xs text-gray-500 mb-3">
        <div>上次同步: <span id="lastSyncTime">-</span></div>
        <div>上次加载: <span id="lastLoadTime">-</span></div>
      </div>
      <div id="syncMessage" class="text-sm text-red-600 mb-2 hidden"></div>
      <div class="flex gap-2">
        <button id="syncNow" class="flex-1 px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 text-sm">立即同步</button>
        <button id="loadFromCloudBtn" class="flex-1 px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 text-sm">从云端加载</button>
      </div>
    </div>

    <!-- 月度统计 -->
    <div class="p-4 border-t bg-gray-50">
      <h3 class="font-semibold mb-3">本月统计</h3>
      <div id="monthlyStats" class="space-y-2"></div>
      <div class="mt-4 pt-3 border-t">
        <div class="flex justify-between text-lg">
          <span>本月工资总计:</span>
          <span class="font-bold text-blue-600" id="totalSalary">¥ 0.00</span>
        </div>
      </div>
    </div>

    <!-- 添加记录弹窗 -->
    <div id="addModal" class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 hidden">
      <div class="bg-white rounded-xl w-full max-w-sm p-4">
        <h3 class="font-semibold mb-4">添加记录</h3>
        <div class="space-y-3">
          <div>
            <label class="block text-sm text-gray-600 mb-1">日期</label>
            <input type="date" id="modalDate" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
          </div>
          <div>
            <label class="block text-sm text-gray-600 mb-1">产品型号</label>
            <select id="modalProduct" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
              <option value="">选择产品</option>
            </select>
            <input type="text" id="modalProductOther" placeholder="其他型号" class="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg hidden">
          </div>
          <div>
            <label class="block text-sm text-gray-600 mb-1">数量</label>
            <input type="number" id="modalQuantity" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
          </div>
        </div>
        <div class="flex gap-2 mt-4">
          <button id="modalCancel" class="flex-1 px-4 py-2 bg-gray-200 rounded-lg hover:bg-gray-300">取消</button>
          <button id="modalConfirm" class="flex-1 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">确认</button>
        </div>
      </div>
    </div>

    <!-- 编辑记录弹窗 -->
    <div id="editModal" class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 hidden">
      <div class="bg-white rounded-xl w-full max-w-sm p-4">
        <h3 class="font-semibold mb-4">编辑记录</h3>
        <div class="space-y-3">
          <div>
            <label class="block text-sm text-gray-600 mb-1">产品型号</label>
            <input type="text" id="editProduct" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
          </div>
          <div>
            <label class="block text-sm text-gray-600 mb-1">数量</label>
            <input type="number" id="editQuantity" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
          </div>
        </div>
        <div class="flex gap-2 mt-4">
          <button id="editDelete" class="flex-1 px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700">删除</button>
          <button id="editCancel" class="flex-1 px-4 py-2 bg-gray-200 rounded-lg hover:bg-gray-300">取消</button>
          <button id="editConfirm" class="flex-1 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">保存</button>
        </div>
      </div>
    </div>

    <!-- 修改单价弹窗 -->
    <div id="editPriceModal" class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 hidden">
      <div class="bg-white rounded-xl w-full max-w-sm p-4">
        <h3 class="font-semibold mb-4">修改单价</h3>
        <div class="space-y-3">
          <div>
            <label class="block text-sm text-gray-600 mb-1">产品型号</label>
            <input type="text" id="editPriceProduct" class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-gray-100" readonly>
          </div>
          <div>
            <label class="block text-sm text-gray-600 mb-1">单价（元）</label>
            <input type="number" id="editPriceValue" step="0.01" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
          </div>
        </div>
        <div class="flex gap-2 mt-4">
          <button id="editPriceCancel" class="flex-1 px-4 py-2 bg-gray-200 rounded-lg hover:bg-gray-300">取消</button>
          <button id="editPriceConfirm" class="flex-1 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">保存</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // JSONBin.io 配置
    const JSONBIN_CONFIG = {
      apiKey: '$2a$10$96/KwEWg7xoD9IxVSxCxxOXYJJbczAK/FXVRmP3S.muJB0NORZ9R.',
      binId: '69f4b45caaba8821975cfb4a',
      baseUrl: 'https://api.jsonbin.io/v3/b'
    };

    // 全局变量
    let currentDate = new Date();
    let records = {}; // { "2024-01": { "01": [{product, quantity}], "02": [...] } }
    let products = {}; // { "型号": 单价 }
    let editingIndex = -1;
    let editingDay = '';
    let isLoadingFromCloud = false;

    // ==================== 价格表模板 ====================
    // 想改价格表，只改这里就行
    const PRICE_TEMPLATE = {
      // 侧网 / 背网 尺寸档位（补 gaps 延续上一档价格）
      // 侧网和背网共用低档位，高档位 onlyBack 只对背网生效
      // 侧网 ≥561 无价格（价格表没写），背网全覆盖
      net: [
        { min: 0, max: 479, price: 0.05 },
        { min: 480, max: 560, price: 0.055 },
        { min: 561, max: 579, price: 0.055, onlyBack: true },
        { min: 580, max: 610, price: 0.06, onlyBack: true },
        { min: 611, max: 619, price: 0.06, onlyBack: true },
        { min: 620, max: 650, price: 0.07, onlyBack: true },
        { min: 651, max: 679, price: 0.07, onlyBack: true },
        { min: 680, max: 690, price: 0.08, onlyBack: true },
        { min: 691, max: 749, price: 0.08, onlyBack: true },
        { min: 750, max: 750, price: 0.1, onlyBack: true },
        { min: 760, max: 840, price: 0.13, onlyBack: true },
      ],
      // 底网规格映射（精确匹配宽×高，按价格表写）
      bottom: [
        { w: 430, h: 430, method: '两边', price: 0.06 },
        { w: 500, h: 380, method: '两边', price: 0.07 },
        { w: 550, h: 390, method: '两边', price: 0.075 },
        { w: 546, h: 400, method: '两边', price: 0.075 },
        { w: 580, h: 390, method: '两边', price: 0.08 },
        { w: 570, h: 430, method: '四边', price: 0.13 },
        { w: 600, h: 380, method: '两边', price: 0.08 },
        { w: 610, h: 390, method: '两边', price: 0.08 },
        { w: 546, h: 430, method: '两边', price: 0.08 },
        { w: 546, h: 430, method: '四边', price: 0.13 },
        { w: 646, h: 400, method: '两边', price: 0.09 },
        { w: 646, h: 400, method: '四边', price: 0.14 },
        { w: 646, h: 430, method: '两边', price: 0.09 },
        { w: 646, h: 430, method: '四边', price: 0.14 },
        { w: 650, h: 430, method: '两边', price: 0.09 },
        { w: 650, h: 430, method: '四边', price: 0.14 },
        { w: 670, h: 430, method: '四边', price: 0.15 },
        { w: 680, h: 430, method: '两边', price: 0.095 },
        { w: 680, h: 430, method: '四边', price: 0.145 },
        { w: 750, h: 390, method: '两边', price: 0.1 },
        { w: 750, h: 390, method: '四边', price: 0.15 },
        { w: 760, h: 550, method: '四边', price: 0.22 },
        { w: 840, h: 500, method: '四边', price: 0.22 },
        { w: 1066, h: 430, method: '四边', price: 0.3 },
        { w: 1200, h: 550, method: '四边', price: 0.36 },
      ]
    };

    // 从产品名提取所有数字（尺寸候选）
    function extractSizeNums(name) {
      return (name.match(/\d+/g) || []).map(Number);
    }

    // 判断产品类型
    function getProductCategory(name) {
      if (name.includes('底网')) return 'bottom';
      if (name.includes('侧网')) return 'side';
      if (name.includes('背网')) return 'back';
      return 'other';
    }

    // 判断修法：两边 or 四边
    function getRepairMethod(name) {
      if (name.includes('四边') || name.includes('四方')) return '四边';
      if (name.includes('两边') || name.includes('两边修')) return '两边';
      return null;
    }

    // 确定用于定价的尺寸：2个数取第一个，3个及以上取中间
    function getPricingSize(name) {
      const nums = extractSizeNums(name);
      if (nums.length === 0) return null;
      if (nums.length === 2) return nums[0];
      return nums[1]; // 3个及以上取中间
    }

    // 自动计算产品建议单价（基于 PRICE_TEMPLATE）
    function calcAutoPrice(name) {
      const category = getProductCategory(name);

      if (category === 'side' || category === 'back') {
        const size = getPricingSize(name);
        if (size === null) return null;
        for (const tier of PRICE_TEMPLATE.net) {
          if (size >= tier.min && size <= tier.max) {
            if (tier.onlyBack && category === 'side') return null;
            return tier.price;
          }
        }
        return null;
      }

      if (category === 'bottom') {
        const nums = extractSizeNums(name);
        const method = getRepairMethod(name);
        if (nums.length < 2 || !method) return null;
        const w = nums[0], h = nums[1];
        for (const spec of PRICE_TEMPLATE.bottom) {
          if (spec.method === method) {
            const a = Math.min(spec.w, spec.h), b = Math.max(spec.w, spec.h);
            const na = Math.min(w, h), nb = Math.max(w, h);
            if (a === na && b === nb) return spec.price;
          }
        }
        return null;
      }

      return null;
    }

    // 对单价为 0 的产品，尝试用模板自动填充
    function applyAutoPrices() {
      let filled = 0;
      for (const key of Object.keys(products)) {
        if (!products[key]) {
          const suggested = calcAutoPrice(key);
          if (suggested !== null) {
            products[key] = suggested;
            filled++;
          }
        }
      }
      if (filled > 0) {
        console.log(`价格表自动填充了 ${filled} 个产品的单价`);
      }
      return filled;
    }

    // 格式化价格，去掉末尾的0
    function formatPrice(num) {
      return parseFloat(num.toFixed(4));
    }

    // 规范化产品名称（用于比较，不直接作为显示）
    // 处理：首尾空格、全角半角、多个连续空格、大小写
    function normalizeProductName(name) {
      if (!name) return '';
      return name
        .trim()
        .normalize('NFKC')
        .replace(/\s+/g, ' ')
        .toLowerCase();
    }

    // 规范化产品名称用于存储（保留大小写，但清理空白和全半角）
    function normalizeForStorage(name) {
      if (!name) return '';
      return name
        .trim()
        .normalize('NFKC')
        .replace(/\s+/g, ' ');
    }

    // 在 products 中查找匹配的 key（不区分大小写、全半角、空白）
    function findProductKey(name) {
      const normalized = normalizeProductName(name);
      if (!normalized) return null;
      for (const key of Object.keys(products)) {
        if (normalizeProductName(key) === normalized) {
          return key;
        }
      }
      return null;
    }

    // 获取产品单价（带规范化匹配）
    function getProductPrice(name) {
      const key = findProductKey(name);
      if (key) return products[key];
      return 0;
    }

    // 带重试的 fetch
    async function fetchWithRetry(url, options, retries = 3, delay = 1500) {
      for (let i = 0; i < retries; i++) {
        try {
          const response = await fetch(url, options);
          return response;
        } catch (e) {
          if (i === retries - 1) throw e;
          console.log(`请求失败，${delay}ms 后重试... (${i + 1}/${retries})`);
          await new Promise(resolve => setTimeout(resolve, delay));
        }
      }
    }

    // 格式化时间
    function formatTime(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      const h = String(date.getHours()).padStart(2, '0');
      const min = String(date.getMinutes()).padStart(2, '0');
      const s = String(date.getSeconds()).padStart(2, '0');
      return `${y}-${m}-${d} ${h}:${min}:${s}`;
    }

    // 显示同步消息
    function showSyncMessage(msg, isError = false) {
      const el = document.getElementById('syncMessage');
      el.textContent = msg;
      el.className = isError ? 'text-sm text-red-600 mb-2' : 'text-sm text-green-600 mb-2';
      if (isError) {
        el.classList.remove('hidden');
      } else {
        setTimeout(() => el.classList.add('hidden'), 3000);
      }
    }

    // 同步数据到云端（带重试）
    async function syncToCloud() {
      if (!JSONBIN_CONFIG.apiKey || !JSONBIN_CONFIG.binId) return;
      try {
        await fetchWithRetry(`${JSONBIN_CONFIG.baseUrl}/${JSONBIN_CONFIG.binId}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': JSONBIN_CONFIG.apiKey
          },
          body: JSON.stringify({ records, products })
        }, 3, 1500);
        document.getElementById('lastSyncTime').textContent = formatTime(new Date());
        showSyncMessage('同步成功！');
      } catch (e) {
        console.log('同步到云端失败:', e);
        showSyncMessage('同步失败，请检查网络', true);
      }
    }

    // 从云端加载数据（带超时和重试）
    async function loadFromCloud() {
      if (!JSONBIN_CONFIG.apiKey || !JSONBIN_CONFIG.binId) return false;
      
      const timeoutPromise = new Promise((_, reject) => 
        setTimeout(() => reject(new Error('timeout')), 8000)
      );
      
      const fetchPromise = async () => {
        const response = await fetch(`${JSONBIN_CONFIG.baseUrl}/${JSONBIN_CONFIG.binId}/latest`, {
          headers: { 'X-Master-Key': JSONBIN_CONFIG.apiKey }
        });
        
        if (response.ok) {
          const data = await response.json();
          if (data.record) {
            isLoadingFromCloud = true;
            records = data.record.records || {};
            products = data.record.products || {};
            cleanDirtyData();
            mergeDuplicateProducts();
            applyAutoPrices();
            localStorage.setItem('piecework_records', JSON.stringify(records));
            localStorage.setItem('piecework_products', JSON.stringify(products));
            console.log('云端数据加载成功:', Object.keys(records).length + ' 个月的数据');
            document.getElementById('lastLoadTime').textContent = formatTime(new Date());
            await syncToCloud();
            return true;
          } else {
            console.log('云端数据为空');
          }
        } else {
          console.log('云端请求失败:', response.status);
        }
        return false;
      }
      
      try {
        const result = await Promise.race([fetchPromise(), timeoutPromise]);
        if (!result) {
          showSyncMessage('云端暂无数据', true);
        }
        return result;
      } catch (e) {
        console.log('从云端加载失败:', e.message);
        showSyncMessage('加载失败，请检查网络', true);
        return false;
      }
    }

    // 初始化
    async function init() {
      loadCloudConfig();
      await loadFromCloud();
      if (!isLoadingFromCloud) {
        loadData();
      }
      renderCurrentMonth();
      renderDailyList();
      renderPriceList();
      renderMonthlyStats();
      bindCloudEvents();
      bindProductEvents();
    }

    // 加载云端配置（硬编码的配置优先级更高）
    function loadCloudConfig() {
      if (!JSONBIN_CONFIG.apiKey) {
        const savedApiKey = localStorage.getItem('jsonbin_apikey');
        if (savedApiKey) JSONBIN_CONFIG.apiKey = savedApiKey;
      }
      if (!JSONBIN_CONFIG.binId) {
        const savedBinId = localStorage.getItem('jsonbin_binid');
        if (savedBinId) JSONBIN_CONFIG.binId = savedBinId;
      }
    }

    // 绑定云端事件
    function bindCloudEvents() {
      document.getElementById('syncNow').addEventListener('click', async () => {
        await syncToCloud();
      });

      document.getElementById('loadFromCloudBtn').addEventListener('click', async () => {
        const success = await loadFromCloud();
        if (success) {
          renderDailyList();
          renderPriceList();
          renderMonthlyStats();
          alert('成功从云端加载数据！');
        } else {
          alert('从云端加载失败，请检查网络或配置');
        }
      });
    }

    // 清理脏数据
    function cleanDirtyData() {
      for (const monthKey in records) {
        const monthData = records[monthKey];
        for (const day in monthData) {
          const dayNum = parseInt(day);
          if (dayNum < 1 || dayNum > 31) {
            delete monthData[day];
            console.log('Cleaned invalid day:', day);
          } else if (!monthData[day] || !Array.isArray(monthData[day])) {
            delete monthData[day];
            console.log('Cleaned invalid data for day:', day);
          }
        }
      }
    }

    // 合并重复的产品单价（同一产品因大小写/全半角/空白差异产生多个条目）
    function mergeDuplicateProducts() {
      const canonical = {}; // normalized name -> canonical key
      const toDelete = [];

      Object.keys(products).forEach(key => {
        const normalized = normalizeProductName(key);
        if (!normalized) {
          toDelete.push(key);
          return;
        }
        if (canonical[normalized]) {
          // 已存在同名产品：保留单价非零的那个，否则保留先出现的
          const existingKey = canonical[normalized];
          if (!products[existingKey] && products[key]) {
            products[existingKey] = products[key];
          }
          toDelete.push(key);
        } else {
          canonical[normalized] = key;
        }
      });

      toDelete.forEach(key => delete products[key]);

      // 将历史记录中的产品名称统一为规范名称
      for (const monthKey in records) {
        const monthData = records[monthKey];
        for (const day in monthData) {
          const dayRecords = monthData[day];
          if (Array.isArray(dayRecords)) {
            dayRecords.forEach(record => {
              const canonicalKey = findProductKey(record.product);
              if (canonicalKey && canonicalKey !== record.product) {
                record.product = canonicalKey;
              }
            });
          }
        }
      }
    }
    
    // 加载本地数据
    function loadData() {
      const savedRecords = localStorage.getItem('piecework_records');
      const savedProducts = localStorage.getItem('piecework_products');
      if (savedRecords) {
        records = JSON.parse(savedRecords);
        cleanDirtyData();
      }
      if (savedProducts) {
        products = JSON.parse(savedProducts);
      }
      mergeDuplicateProducts();
      applyAutoPrices();
    }

    // 保存数据（同时保存到本地和云端）
    function saveRecords() {
      localStorage.setItem('piecework_records', JSON.stringify(records));
      syncToCloud();
    }

    function saveProducts() {
      localStorage.setItem('piecework_products', JSON.stringify(products));
      syncToCloud();
    }

    // 渲染当前月份
    function renderCurrentMonth() {
      const year = currentDate.getFullYear();
      const month = String(currentDate.getMonth() + 1).padStart(2, '0');
      document.getElementById('currentMonth').textContent = `${year}年${month}月`;
    }

    // 获取当月天数
    function getDaysInMonth() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      return new Date(year, month + 1, 0).getDate();
    }

    // 渲染每日列表
    function renderDailyList() {
      const year = currentDate.getFullYear();
      const month = String(currentDate.getMonth() + 1).padStart(2, '0');
      const days = getDaysInMonth();
      const monthKey = `${year}-${month}`;
      const monthRecords = records[monthKey] || {};
      
      let html = '';
      for (let i = 1; i <= days; i++) {
        const day = String(i).padStart(2, '0');
        const dayRecords = monthRecords[day] || [];
        const dayTotal = dayRecords.reduce((sum, r) => sum + r.quantity * getProductPrice(r.product), 0);
        
        html += `
          <div class="bg-gray-50 rounded-lg p-3">
            <div class="flex justify-between items-center mb-2">
              <span class="font-semibold">${month}月${day}日</span>
              <span class="text-sm text-gray-500">¥${formatPrice(dayTotal)}</span>
            </div>
            <div class="space-y-1" id="day-${day}">
        `;
        
        if (dayRecords.length === 0) {
          html += `<div class="text-gray-400 text-sm">暂无记录</div>`;
        } else {
          dayRecords.forEach((record, idx) => {
            const price = getProductPrice(record.product);
            html += `
              <div class="flex justify-between items-center p-2 bg-white rounded text-sm" data-idx="${idx}">
                <div>
                  <span class="font-medium">${record.product}</span>
                  <span class="text-gray-500 ml-2">${record.quantity}个</span>
                  <span class="text-gray-400 ml-2">@¥${formatPrice(price)}</span>
                </div>
                <div class="flex gap-1">
                  <span class="text-blue-600">¥${formatPrice(record.quantity * price)}</span>
                  <button class="edit-btn text-gray-400 hover:text-blue-500" data-day="${day}" data-idx="${idx}">✏️</button>
                </div>
              </div>
            `;
          });
        }
        
        html += `
            </div>
            <button class="add-day-btn w-full mt-2 py-2 text-blue-600 text-sm border border-blue-200 rounded hover:bg-blue-50" data-day="${day}">+ 添加记录</button>
          </div>
        `;
      }
      
      document.getElementById('dailyList').innerHTML = html;
      bindDayEvents();
    }

    // 绑定每日列表事件
    function bindDayEvents() {
      document.querySelectorAll('.add-day-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          const day = this.dataset.day;
          openAddModal(day);
        });
      });
      
      document.querySelectorAll('.edit-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          const day = this.dataset.day;
          const idx = parseInt(this.dataset.idx);
          openEditModal(day, idx);
        });
      });
    }

    // 渲染价格列表
    function renderPriceList() {
      let html = '';
      const productKeys = Object.keys(products).sort();
      productKeys.forEach(product => {
        const encodedProduct = encodeURIComponent(product);
        const currentPrice = products[product];
        const suggested = calcAutoPrice(product);
        let suggestionHtml = '';
        if (suggested !== null) {
          if (!currentPrice) {
            suggestionHtml = `<span class="text-xs text-orange-500 ml-1">建议 ¥${formatPrice(suggested)}</span>`;
          } else if (Math.abs(currentPrice - suggested) > 0.0001) {
            suggestionHtml = `<span class="text-xs text-gray-400 ml-1">(模板 ¥${formatPrice(suggested)})</span>`;
          }
        } else if (!currentPrice) {
          suggestionHtml = `<span class="text-xs text-red-400 ml-1">无法自动定价</span>`;
        }
        html += `
          <div class="flex justify-between items-center p-2 bg-gray-50 rounded">
            <span>${product}</span>
            <div class="flex items-center gap-2">
              <span class="text-blue-600">¥${formatPrice(currentPrice)}</span>
              ${suggestionHtml}
              <button class="edit-price-btn text-blue-400 hover:text-blue-600" data-product="${encodedProduct}" title="编辑">✏️</button>
              <button class="delete-product-btn text-red-400 hover:text-red-600" data-product="${encodedProduct}" title="删除">🗑️</button>
            </div>
          </div>
        `;
      });
      document.getElementById('priceList').innerHTML = html;
      updateProductDropdown();
    }
    
    function updateProductDropdown() {
      const suggestions = [];
      const currentYear = currentDate.getFullYear();
      const currentMonth = String(currentDate.getMonth() + 1).padStart(2, '0');
      const monthKey = `${currentYear}-${currentMonth}`;
      const seen = new Set();
      
      if (records[monthKey]) {
        Object.values(records[monthKey]).forEach(dayRecords => {
          dayRecords.forEach(record => {
            if (!seen.has(record.product)) {
              seen.add(record.product);
              suggestions.push(record.product);
            }
          });
        });
      }
      
      Object.keys(products).forEach(product => {
        if (!seen.has(product)) {
          seen.add(product);
          suggestions.push(product);
        }
      });
      
      const dropdown = document.getElementById('productDropdown');
      dropdown.innerHTML = '';
      
      if (suggestions.length > 0) {
        suggestions.forEach(product => {
          const item = document.createElement('div');
          item.className = 'px-3 py-2 cursor-pointer hover:bg-blue-50';
          item.textContent = product;
          item.addEventListener('click', () => {
            document.getElementById('newProduct').value = product;
            dropdown.classList.add('hidden');
          });
          dropdown.appendChild(item);
        });
      }
    }
    
    function showProductDropdown() {
      updateProductDropdown();
      const dropdown = document.getElementById('productDropdown');
      const input = document.getElementById('newProduct');
      const filter = input.value.toLowerCase();
      
      const items = dropdown.querySelectorAll('div');
      items.forEach(item => {
        const text = item.textContent.toLowerCase();
        item.style.display = text.includes(filter) ? 'block' : 'none';
      });
      
      dropdown.classList.remove('hidden');
    }
    
    function hideProductDropdown() {
      setTimeout(() => {
        document.getElementById('productDropdown').classList.add('hidden');
      }, 200);
    }

    // 绑定产品事件
    function bindProductEvents() {
      document.getElementById('priceList').addEventListener('click', function(e) {
        const target = e.target;
        
        if (target.classList.contains('delete-product-btn')) {
          const product = decodeURIComponent(target.dataset.product);
          if (confirm(`确定删除产品 "${product}" 吗？`)) {
            delete products[product];
            saveProducts();
            renderPriceList();
            renderDailyList();
            renderMonthlyStats();
          }
        } else if (target.classList.contains('edit-price-btn')) {
          const editingProduct = decodeURIComponent(target.dataset.product);
          document.getElementById('editPriceProduct').value = editingProduct;
          document.getElementById('editPriceValue').value = products[editingProduct];
          document.getElementById('editPriceModal').dataset.product = editingProduct;
          document.getElementById('editPriceModal').classList.remove('hidden');
        }
      });
    }
    
    // 编辑价格确认事件（只绑定一次）
    document.getElementById('editPriceConfirm').addEventListener('click', () => {
      const editingProduct = document.getElementById('editPriceModal').dataset.product;
      const newPrice = parseFloat(document.getElementById('editPriceValue').value);
      if (!isNaN(newPrice) && editingProduct) {
        products[editingProduct] = newPrice;
        saveProducts();
        renderPriceList();
        renderDailyList();
        renderMonthlyStats();
        document.getElementById('editPriceModal').classList.add('hidden');
        document.getElementById('editPriceModal').dataset.product = '';
      } else {
        alert('请输入有效的单价');
      }
    });
    
    document.getElementById('editPriceCancel').addEventListener('click', () => {
      document.getElementById('editPriceModal').classList.add('hidden');
      document.getElementById('editPriceModal').dataset.product = '';
    });

    // 渲染月度统计
    function renderMonthlyStats() {
      const year = currentDate.getFullYear();
      const month = String(currentDate.getMonth() + 1).padStart(2, '0');
      const monthKey = `${year}-${month}`;
      const monthRecords = records[monthKey] || {};
      
      const productTotals = {};
      let totalSalary = 0;
      
      Object.keys(monthRecords).forEach(day => {
        monthRecords[day].forEach(record => {
          if (!productTotals[record.product]) {
            productTotals[record.product] = 0;
          }
          productTotals[record.product] += record.quantity;
        });
      });
      
      let html = '';
      Object.keys(productTotals).forEach(product => {
        const quantity = productTotals[product];
        const price = getProductPrice(product);
        const amount = quantity * price;
        totalSalary += amount;
        html += `
          <div class="flex justify-between items-center py-1">
            <div>
              <span>${product}</span>
              <span class="text-gray-500 text-sm ml-2">${quantity}个</span>
              <span class="text-gray-400 text-sm ml-2">@¥${formatPrice(price)}</span>
            </div>
            <span class="text-blue-600">¥${formatPrice(amount)}</span>
          </div>
        `;
      });
      
      if (Object.keys(productTotals).length === 0) {
        html = '<div class="text-gray-400 text-center py-4">本月暂无记录</div>';
      }
      
      document.getElementById('monthlyStats').innerHTML = html;
      document.getElementById('totalSalary').textContent = `¥${formatPrice(totalSalary)}`;
    }

    // 打开添加弹窗
    function openAddModal(day) {
      const year = currentDate.getFullYear();
      const month = String(currentDate.getMonth() + 1).padStart(2, '0');
      document.getElementById('modalDate').value = `${year}-${month}-${day}`;
      document.getElementById('modalQuantity').value = '';
      document.getElementById('modalProductOther').value = '';
      document.getElementById('modalProductOther').classList.add('hidden');
      populateProductSelect();
      document.getElementById('addModal').classList.remove('hidden');
    }

    // 打开编辑弹窗
    function openEditModal(day, idx) {
      const year = currentDate.getFullYear();
      const month = String(currentDate.getMonth() + 1).padStart(2, '0');
      const monthKey = `${year}-${month}`;
      const record = records[monthKey]?.[day]?.[idx];
      
      if (record) {
        editingDay = day;
        editingIndex = idx;
        document.getElementById('editProduct').value = record.product;
        document.getElementById('editQuantity').value = record.quantity;
        document.getElementById('editModal').classList.remove('hidden');
      }
    }

    // 填充产品选择
    function populateProductSelect() {
      const select = document.getElementById('modalProduct');
      select.innerHTML = '<option value="">选择产品</option>';
      
      const seen = new Set();
      
      // 从所有历史记录中获取产品型号
      Object.values(records).forEach(monthData => {
        Object.values(monthData).forEach(dayRecords => {
          dayRecords.forEach(record => {
            if (!seen.has(record.product)) {
              seen.add(record.product);
              const option = document.createElement('option');
              option.value = record.product;
              option.textContent = record.product;
              select.appendChild(option);
            }
          });
        });
      });
      
      // 添加已设置单价的产品（可能还没有记录）
      Object.keys(products).forEach(product => {
        if (!seen.has(product)) {
          seen.add(product);
          const option = document.createElement('option');
          option.value = product;
          option.textContent = product;
          select.appendChild(option);
        }
      });
      
      const otherOption = document.createElement('option');
      otherOption.value = '__other__';
      otherOption.textContent = '其他型号';
      select.appendChild(otherOption);
    }

    // 添加记录
    function addRecord(date, product, quantity) {
      const [year, month, day] = date.split('-');
      const dayNum = parseInt(day);
      
      if (dayNum < 1 || dayNum > 31) {
        console.error('Invalid day:', day);
        return;
      }
      
      // 规范化产品名称：若已存在同名产品则使用规范名称，避免产生变体
      const cleanedProduct = normalizeForStorage(product);
      const canonicalKey = findProductKey(cleanedProduct);
      const finalProduct = canonicalKey || cleanedProduct;
      
      const monthKey = `${year}-${month}`;
      
      if (!records[monthKey]) records[monthKey] = {};
      if (!records[monthKey][day]) records[monthKey][day] = [];
      
      records[monthKey][day].push({ product: finalProduct, quantity });
      saveRecords();
    }

    // 更新记录
    function updateRecord(day, idx, product, quantity) {
      const year = currentDate.getFullYear();
      const month = String(currentDate.getMonth() + 1).padStart(2, '0');
      const monthKey = `${year}-${month}`;
      
      // 规范化产品名称
      const cleanedProduct = normalizeForStorage(product);
      const canonicalKey = findProductKey(cleanedProduct);
      const finalProduct = canonicalKey || cleanedProduct;
      
      if (records[monthKey]?.[day]) {
        records[monthKey][day][idx] = { product: finalProduct, quantity };
        saveRecords();
      }
    }

    // 删除记录
    function deleteRecord(day, idx) {
      const year = currentDate.getFullYear();
      const month = String(currentDate.getMonth() + 1).padStart(2, '0');
      const monthKey = `${year}-${month}`;
      
      if (records[monthKey]?.[day]) {
        records[monthKey][day].splice(idx, 1);
        saveRecords();
      }
    }

    // 清空某天记录
    function clearDayRecords(day) {
      const year = currentDate.getFullYear();
      const month = String(currentDate.getMonth() + 1).padStart(2, '0');
      const monthKey = `${year}-${month}`;
      
      if (records[monthKey]) {
        records[monthKey][day] = [];
        saveRecords();
      }
    }

    // 提取日期：返回 { day, month, matched } 或 null
    function extractDate(text) {
      let m;
      m = text.match(/(\d{1,2})月\s*\d{1,2}[号日]?\s*[-－—~～]\s*(\d{1,2})[号日]?/);
      if (m) return { month: parseInt(m[1]), day: parseInt(m[2]), matched: m[0] };
      m = text.match(/(\d{1,2})月\s*(\d{1,2})[号日]?/);
      if (m) return { month: parseInt(m[1]), day: parseInt(m[2]), matched: m[0] };
      m = text.match(/(\d{1,2})\s*[-－—~～]\s*(\d{1,2})[号日]?/);
      if (m) return { month: null, day: parseInt(m[2]), matched: m[0] };
      m = text.match(/(\d{1,2})[号日]/);
      if (m) return { month: null, day: parseInt(m[1]), matched: m[0] };
      return null;
    }

    // 从一行文本中提取所有 产品+数量 对
    function extractProducts(text) {
      const results = [];
      const segments = text.split(/[,，；;、]+/).map(s => s.trim()).filter(Boolean);
      for (const seg of segments) {
        const m = seg.match(/^(.+?)(\d+)\s*[个片只件张]$/i);
        if (m) {
          const product = m[1].trim();
          const quantity = parseInt(m[2]);
          if (product && quantity > 0) {
            results.push({ product, quantity });
          }
        }
      }
      return results;
    }

    // 文本识别：解析整段文本，返回 [{ month, day, product, quantity }]
    function parseQuickInput(text, defaultMonth) {
      const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      const records = [];
      let pendingDate = null;

      for (const line of lines) {
        const date = extractDate(line);
        const productText = date ? line.replace(date.matched, '').trim() : line;
        const products = extractProducts(productText);

        if (date && products.length > 0) {
          const month = date.month || defaultMonth;
          for (const p of products) {
            records.push({ month, day: date.day, product: p.product, quantity: p.quantity });
          }
          pendingDate = date;
        } else if (date && products.length === 0) {
          pendingDate = date;
        } else if (!date && products.length > 0 && pendingDate) {
          const month = pendingDate.month || defaultMonth;
          for (const p of products) {
            records.push({ month, day: pendingDate.day, product: p.product, quantity: p.quantity });
          }
        }
      }
      return records;
    }

    // 事件监听
    document.getElementById('prevMonth').addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCurrentMonth();
      renderDailyList();
      renderMonthlyStats();
    });

    document.getElementById('nextMonth').addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCurrentMonth();
      renderDailyList();
      renderMonthlyStats();
    });

    document.getElementById('todayBtn').addEventListener('click', () => {
      currentDate = new Date();
      renderCurrentMonth();
      renderDailyList();
      renderMonthlyStats();
    });

    document.getElementById('clearDayBtn').addEventListener('click', () => {
      const day = String(currentDate.getDate()).padStart(2, '0');
      if (confirm('确定清空今天的所有记录吗？')) {
        clearDayRecords(day);
        renderDailyList();
        renderMonthlyStats();
      }
    });

    document.getElementById('quickAdd').addEventListener('click', () => {
      const input = document.getElementById('quickInput').value.trim();
      if (!input) return;
      
      const year = currentDate.getFullYear();
      const defaultMonth = currentDate.getMonth() + 1;
      const preview = [];
      
      const results = parseQuickInput(input, defaultMonth);
      results.forEach(r => {
        const dayNum = parseInt(r.day);
        if (dayNum >= 1 && dayNum <= 31 && r.product && r.product.length >= 2 && r.quantity > 0) {
          const month = String(r.month).padStart(2, '0');
          const day = String(dayNum).padStart(2, '0');
          preview.push({ day: `${year}-${month}-${day}`, product: r.product, quantity: r.quantity });
        }
      });
      
      showQuickPreview(preview);
    });
    
    function showQuickPreview(preview) {
      const previewEl = document.getElementById('quickPreview');
      if (preview.length === 0) {
        previewEl.classList.add('hidden');
        return;
      }
      
      let html = '<div class="font-medium mb-2">预览（共' + preview.length + '条）：</div>';
      preview.forEach((item, i) => {
        html += '<div class="flex justify-between py-1 border-b border-gray-200 last:border-0">';
        html += '<span class="text-gray-600">' + item.day + '</span>';
        html += '<span class="text-blue-600 truncate mx-2">' + item.product + '</span>';
        html += '<span class="text-green-600">' + item.quantity + '个</span>';
        html += '</div>';
      });
      html += '<div class="flex gap-2 mt-3">';
      html += '<button id="quickConfirm" class="flex-1 px-3 py-1 bg-green-600 text-white rounded text-sm hover:bg-green-700">确认添加</button>';
      html += '<button id="quickCancel" class="flex-1 px-3 py-1 bg-gray-300 text-gray-700 rounded text-sm hover:bg-gray-400">取消</button>';
      html += '</div>';
      
      previewEl.innerHTML = html;
      previewEl.classList.remove('hidden');
      
      document.getElementById('quickConfirm').addEventListener('click', () => {
        preview.forEach(item => {
          addRecord(item.day, item.product, item.quantity);
        });
        previewEl.classList.add('hidden');
        document.getElementById('quickInput').value = '';
        renderDailyList();
        renderMonthlyStats();
        alert('添加成功！共 ' + preview.length + ' 条记录');
      });
      
      document.getElementById('quickCancel').addEventListener('click', () => {
        previewEl.classList.add('hidden');
      });
    }

    document.getElementById('newProduct').addEventListener('focus', () => {
      showProductDropdown();
    });

    document.getElementById('newProduct').addEventListener('input', () => {
      showProductDropdown();
    });

    document.getElementById('newProduct').addEventListener('blur', () => {
      hideProductDropdown();
    });

    document.getElementById('addProduct').addEventListener('click', () => {
      const rawProduct = document.getElementById('newProduct').value;
      const price = parseFloat(document.getElementById('newPrice').value);
      const product = normalizeForStorage(rawProduct);

      if (product && !isNaN(price)) {
        // 检查是否已存在同名产品（不区分大小写、全半角、空白）
        const existingKey = findProductKey(product);
        if (existingKey) {
          // 已存在则更新单价，避免产生重复条目
          products[existingKey] = price;
        } else {
          products[product] = price;
        }
        saveProducts();
        renderPriceList();
        renderDailyList();
        renderMonthlyStats();
        document.getElementById('newProduct').value = '';
        document.getElementById('newPrice').value = '';
      } else {
        alert('请输入正确的产品型号和单价');
      }
    });

    document.getElementById('modalProduct').addEventListener('change', () => {
      const select = document.getElementById('modalProduct');
      const otherInput = document.getElementById('modalProductOther');
      if (select.value === '__other__') {
        otherInput.classList.remove('hidden');
      } else {
        otherInput.classList.add('hidden');
      }
    });

    document.getElementById('modalConfirm').addEventListener('click', () => {
      const date = document.getElementById('modalDate').value;
      const selectProduct = document.getElementById('modalProduct').value;
      const otherProduct = document.getElementById('modalProductOther').value.trim();
      const quantity = parseInt(document.getElementById('modalQuantity').value);
      
      const product = selectProduct === '__other__' ? otherProduct : selectProduct;
      
      if (date && product && !isNaN(quantity) && quantity > 0) {
        addRecord(date, product, quantity);
        document.getElementById('addModal').classList.add('hidden');
        renderDailyList();
        renderMonthlyStats();
      } else {
        alert('请填写完整信息');
      }
    });

    document.getElementById('modalCancel').addEventListener('click', () => {
      document.getElementById('addModal').classList.add('hidden');
    });

    document.getElementById('editConfirm').addEventListener('click', () => {
      const product = document.getElementById('editProduct').value.trim();
      const quantity = parseInt(document.getElementById('editQuantity').value);
      
      if (product && !isNaN(quantity) && quantity > 0) {
        updateRecord(editingDay, editingIndex, product, quantity);
        document.getElementById('editModal').classList.add('hidden');
        renderDailyList();
        renderMonthlyStats();
      } else {
        alert('请填写完整信息');
      }
    });

    document.getElementById('editDelete').addEventListener('click', () => {
      if (confirm('确定删除这条记录吗？')) {
        deleteRecord(editingDay, editingIndex);
        document.getElementById('editModal').classList.add('hidden');
        renderDailyList();
        renderMonthlyStats();
      }
    });

    document.getElementById('editCancel').addEventListener('click', () => {
      document.getElementById('editModal').classList.add('hidden');
    });

    // 键盘事件
    document.getElementById('quickInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.ctrlKey) {
        document.getElementById('quickAdd').click();
      }
    });

    // 初始化
    init();
  </script>
